name: Build Android APK and iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'weather_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: weather_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean previous build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Verify home_widget dependency resolved
        run: grep -A2 "^  home_widget:" pubspec.lock

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build APK (release)
        run: flutter build apk --release --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: weather_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Commit updated pubspec.lock
        # Коммитим сгенерированный pubspec.lock обратно в репозиторий, чтобы
        # он был виден в GitHub (и совпадал с тем, что реально ушло в сборку).
        # Без этого шага lock-файл существовал только внутри runner'а и
        # пропадал вместе с ним после сборки.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- pubspec.lock; then
            git add pubspec.lock
            git commit -m "chore: update pubspec.lock [skip ci]"
            git push
          else
            echo "pubspec.lock unchanged, nothing to commit"
          fi

  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: weather_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean previous build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Generate app icons
        run: dart run flutter_launcher_icons

      - name: Build iOS (release, no codesign)
        # Основной таргет Runner + Widget Extension таргет (WeatherWidgetExtension)
        # собираются вместе: расширение подключено как PBXTargetDependency
        # у Runner, поэтому buildImplicitDependencies в схеме Runner сам
        # подтягивает и собирает .appex. Отдельная схема для расширения
        # не нужна и не должна указываться явно.
        #
        # ВАЖНО: --no-codesign даёт неподписанный .app/.appex — этого
        # достаточно, чтобы проверить, что весь граф целей (включая новый
        # target) компилируется, но реальные entitlements (App Group)
        # в такую сборку не прописываются. Для установки на устройство
        # или TestFlight нужна отдельная подписанная сборка
        # (flutter build ipa --export-options-plist=...) с настроенным
        # Apple Developer аккаунтом/профилем, который здесь не настраивается.
        run: flutter build ios --release --no-codesign --verbose

      - name: Verify WeatherWidgetExtension was built
        # Если target расширения не подключился к сборке (например, из-за
        # поломанного project.pbxproj), Runner.app соберётся, но .appex
        # внутри PlugIns не появится — сборка Flutter при этом не упадёт,
        # так что проверяем явно, а не полагаемся на общий success шага выше.
        run: |
          set -euo pipefail
          APPEX_PATH="build/ios/iphoneos/Runner.app/PlugIns/WeatherWidgetExtension.appex"
          if [ ! -d "$APPEX_PATH" ]; then
            echo "::error::WeatherWidgetExtension.appex not found in build output — widget target did not build."
            exit 1
          fi
          echo "Found $APPEX_PATH"

      - name: Package unsigned IPA
        # flutter build ipa требует настроенную подпись/профиль, поэтому
        # для неподписанного IPA собираем Payload-структуру вручную из
        # уже собранного Runner.app и упаковываем её в .ipa (это обычный zip).
        run: |
          set -euo pipefail
          BUILD_DIR="build/ios/iphoneos"
          PAYLOAD_DIR="$BUILD_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$BUILD_DIR/Runner.app" "$PAYLOAD_DIR/Runner.app"
          cd "$BUILD_DIR"
          zip -r -q -X app-release-unsigned.ipa Payload
          cd -
          mv "$BUILD_DIR/app-release-unsigned.ipa" .

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-ipa
          path: weather_app/app-release-unsigned.ipa
