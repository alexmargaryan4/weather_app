name: Build Android APK and iOS IPA

on:
  push:
    branches: [ main ]
    paths:
      - 'weather_app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: weather_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean previous build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Verify home_widget dependency resolved
        run: grep -A2 "^  home_widget:" pubspec.lock

      - name: Build APK (release)
        run: flutter build apk --release --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: weather_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Commit updated pubspec.lock
        # Коммитим сгенерированный pubspec.lock обратно в репозиторий, чтобы
        # он был виден в GitHub (и совпадал с тем, что реально ушло в сборку).
        # Без этого шага lock-файл существовал только внутри runner'а и
        # пропадал вместе с ним после сборки.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- pubspec.lock; then
            git add pubspec.lock
            git commit -m "chore: update pubspec.lock [skip ci]"
            git push
          else
            echo "pubspec.lock unchanged, nothing to commit"
          fi

  build-ios:
    runs-on: macos-latest

    defaults:
      run:
        working-directory: weather_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Clean previous build artifacts
        run: flutter clean

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS (release, no codesign)
        # Виджеты (home_widget) на iOS не настроены (нужен отдельный Widget
        # Extension target и App Group) — на этом этапе просто собираем
        # основное приложение без подписи, как обычный .app-бандл.
        run: flutter build ios --release --no-codesign --verbose

      - name: Package unsigned IPA
        # flutter build ipa требует настроенную подпись/профиль, поэтому
        # для неподписанного IPA собираем Payload-структуру вручную из
        # уже собранного Runner.app и упаковываем её в .ipa (это обычный zip).
        run: |
          set -euo pipefail
          BUILD_DIR="build/ios/iphoneos"
          PAYLOAD_DIR="$BUILD_DIR/Payload"
          mkdir -p "$PAYLOAD_DIR"
          cp -R "$BUILD_DIR/Runner.app" "$PAYLOAD_DIR/Runner.app"
          cd "$BUILD_DIR"
          zip -r -q -X app-release-unsigned.ipa Payload
          cd -
          mv "$BUILD_DIR/app-release-unsigned.ipa" .

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned-ipa
          path: weather_app/app-release-unsigned.ipa
